[pytest]
testpaths = tests
asyncio_mode = auto

markers =
    regression: pruebas de regresión con entorno real/dataset golden; correr con `pytest -m regression` y excluir con `pytest -m "not regression"`.

# Silenciar deprecaciones ruidosas de terceros (langchain-community, ragas legacy).
# Son conocidas y rastreadas como deuda técnica (ERR-021), no fallos del proyecto.
filterwarnings =
    ignore::DeprecationWarning:langchain_community.*
    ignore::DeprecationWarning:ragas.*
